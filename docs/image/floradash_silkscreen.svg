<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  FloraDash - Soil Probe Silkscreen Design
  Racines ramifiées + gouttes d'eau
  
  Dimensions du dessin : 20mm x 90mm (ajustable au scaling lors de l'import KiCad)
  ViewBox en mm pour faciliter l'import à l'échelle réelle.
  
  Import dans KiCad :
  1. PCB Editor > File > Import > Graphics
  2. Choisir ce fichier .svg
  3. Layer : F.Silkscreen (ou B.Silkscreen pour face arrière)
  4. Vérifier l'échelle (1 unité SVG = 1 mm)
  5. Line width minimum : 0.15mm (vérifier DRC du fab)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="20mm" height="90mm"
     viewBox="0 0 20 90"
     version="1.1">

  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">

    <!-- ============================================================ -->
    <!-- TRUNK / TRONC PRINCIPAL - largeur 0.3mm -->
    <!-- ============================================================ -->
    <path d="M 10 2
             C 9.7 8, 10.3 14, 10 20
             C 9.7 26, 10.4 32, 10 38
             C 9.6 44, 10.3 50, 10 56
             C 9.7 62, 10.3 68, 10 74
             C 9.85 80, 10.15 85, 10 88"
          stroke-width="0.3"/>

    <!-- ============================================================ -->
    <!-- RACINES SECONDAIRES - largeur 0.22mm -->
    <!-- ============================================================ -->

    <!-- Root 1 : gauche, y≈6 -->
    <path d="M 10 5.5
             C 8.5 7, 6.7 7.5, 5.2 9
             C 4 10.2, 3 11.8, 2.5 13.3"
          stroke-width="0.22"/>

    <!-- Root 2 : droite, y≈10 -->
    <path d="M 10 9.5
             C 11.8 11, 13.7 11.7, 15.5 13.5
             C 16.7 14.7, 17.6 16.5, 17.9 18.2"
          stroke-width="0.22"/>

    <!-- Root 3 : gauche, y≈18 -->
    <path d="M 10 17.5
             C 8.2 19.5, 6 21, 4.2 23
             C 3 24.5, 2 26.3, 1.5 28.2"
          stroke-width="0.22"/>

    <!-- Root 3b : fork de root 3 -->
    <path d="M 6 21
             C 5 22.2, 4.7 23.7, 5 25.2"
          stroke-width="0.22"/>

    <!-- Root 4 : droite, y≈22 -->
    <path d="M 10 22
             C 12.1 23.5, 14.2 24.5, 16 26.5
             C 17.2 27.8, 18 29.3, 18.3 31"
          stroke-width="0.22"/>

    <!-- Root 5 : droite, y≈30 -->
    <path d="M 10 30
             C 11.8 31.3, 13.3 32.5, 14.2 34.4
             C 14.8 36, 14.8 37.7, 14.5 39.5"
          stroke-width="0.22"/>

    <!-- Root 5b : fork -->
    <path d="M 13.3 32.5
             C 13.9 33.7, 13.9 34.8, 13.3 35.8"
          stroke-width="0.22"/>

    <!-- Root 6 : gauche, y≈34 -->
    <path d="M 10 34
             C 7.9 35.3, 6 36.8, 4.8 38.6
             C 3.9 40.1, 3.3 41.9, 3 43.7"
          stroke-width="0.22"/>

    <!-- Root 6b : fork de root 6 -->
    <path d="M 6 36.8
             C 5.4 38, 5.2 39, 5.2 40.3"
          stroke-width="0.22"/>

    <!-- Root 7 : droite, y≈42 -->
    <path d="M 10 41.7
             C 11.8 42.9, 13.6 44.1, 14.8 45.8
             C 15.7 47.1, 16.3 48.5, 16.6 49.9"
          stroke-width="0.22"/>

    <!-- Root 8 : gauche, y≈46 -->
    <path d="M 10 45.7
             C 8.2 47, 6.4 48.3, 5.2 50
             C 4.3 51.3, 3.7 52.7, 3.5 54.2"
          stroke-width="0.22"/>

    <!-- Root 9 : droite, y≈54 -->
    <path d="M 10 53.8
             C 11.5 55, 13 56.2, 13.9 57.8
             C 14.5 59, 14.8 60.2, 14.8 61.5"
          stroke-width="0.22"/>

    <!-- Root 10 : gauche, y≈58 -->
    <path d="M 10 57.7
             C 8.5 58.9, 7 60.1, 6.1 61.7
             C 5.5 62.9, 5.2 64.2, 5.2 65.5"
          stroke-width="0.22"/>

    <!-- Root 11 : droite, y≈66 -->
    <path d="M 10 65.7
             C 11.3 66.7, 12.4 67.8, 13 69.1"
          stroke-width="0.22"/>

    <!-- Root 12 : gauche, y≈70 -->
    <path d="M 10 69.7
             C 8.9 70.7, 8 71.7, 7.5 72.9"
          stroke-width="0.22"/>

    <!-- ============================================================ -->
    <!-- RADICELLES / ROOT HAIRS - largeur 0.12mm -->
    <!-- ============================================================ -->

    <!-- Sur root 1 -->
    <path d="M 5.2 9 C 4.5 9.5, 4 10.2, 3.7 11" stroke-width="0.12"/>
    <path d="M 4 11 L 3.3 12" stroke-width="0.12"/>
    <path d="M 2.5 13.3 L 1.9 14.4" stroke-width="0.12"/>
    <path d="M 3 12.8 L 2.4 13.8" stroke-width="0.12"/>

    <!-- Sur root 2 -->
    <path d="M 15.5 13.5 C 16.3 14.3, 16.8 15.2, 17.3 16.2" stroke-width="0.12"/>
    <path d="M 16.5 15.5 L 17.2 16.4" stroke-width="0.12"/>
    <path d="M 17.9 18.2 L 18.7 19.4" stroke-width="0.12"/>

    <!-- Sur root 3 -->
    <path d="M 4.2 23 C 3.4 23.9, 2.9 24.9, 2.6 25.9" stroke-width="0.12"/>
    <path d="M 2.9 25 L 2.2 25.9" stroke-width="0.12"/>
    <path d="M 1.5 28.2 L 0.9 29.4" stroke-width="0.12"/>
    <path d="M 2 27.2 L 1.4 28.2" stroke-width="0.12"/>

    <!-- Sur root 3b -->
    <path d="M 5 25.2 L 4.5 26.2" stroke-width="0.12"/>

    <!-- Sur root 4 -->
    <path d="M 16 26.5 C 16.7 27.4, 17.2 28.3, 17.6 29.2" stroke-width="0.12"/>
    <path d="M 16.8 28.5 L 17.5 29.3" stroke-width="0.12"/>
    <path d="M 18.3 31 L 19 32.1" stroke-width="0.12"/>

    <!-- Sur root 5 -->
    <path d="M 14.2 34.4 C 14.7 35.3, 15 36.2, 15.1 37.1" stroke-width="0.12"/>
    <path d="M 14.8 36.5 L 15.4 37.2" stroke-width="0.12"/>
    <path d="M 14.5 39.5 L 14.8 40.7" stroke-width="0.12"/>
    <path d="M 14.1 38.7 L 14.4 39.7" stroke-width="0.12"/>

    <!-- Sur root 6 -->
    <path d="M 4.8 38.6 C 4.1 39.6, 3.7 40.5, 3.4 41.5" stroke-width="0.12"/>
    <path d="M 3.7 40.9 L 3.1 41.8" stroke-width="0.12"/>
    <path d="M 3 43.7 L 2.5 44.9" stroke-width="0.12"/>
    <path d="M 3.5 42.9 L 3 43.9" stroke-width="0.12"/>

    <!-- Sur root 7 -->
    <path d="M 14.8 45.8 C 15.3 46.7, 15.6 47.6, 15.7 48.5" stroke-width="0.12"/>
    <path d="M 15.4 47.7 L 15.9 48.5" stroke-width="0.12"/>
    <path d="M 16.6 49.9 L 17.1 51" stroke-width="0.12"/>

    <!-- Sur root 8 -->
    <path d="M 5.2 50 C 4.5 50.9, 4 51.8, 3.7 52.7" stroke-width="0.12"/>
    <path d="M 4.2 51.8 L 3.7 52.6" stroke-width="0.12"/>
    <path d="M 3.5 54.2 L 3 55.4" stroke-width="0.12"/>
    <path d="M 3.7 53.4 L 3.2 54.3" stroke-width="0.12"/>

    <!-- Sur root 9 -->
    <path d="M 13.9 57.8 C 14.4 58.6, 14.7 59.4, 14.8 60.2" stroke-width="0.12"/>
    <path d="M 14.5 59.5 L 14.9 60.2" stroke-width="0.12"/>

    <!-- Sur root 10 -->
    <path d="M 6.1 61.7 C 5.7 62.5, 5.4 63.3, 5.3 64.1" stroke-width="0.12"/>
    <path d="M 5.7 63.2 L 5.3 64" stroke-width="0.12"/>

    <!-- Sur root 11 -->
    <path d="M 13 69.1 L 13.4 70" stroke-width="0.12"/>

    <!-- Sur root 12 -->
    <path d="M 7.5 72.9 L 7.1 73.8" stroke-width="0.12"/>

    <!-- ============================================================ -->
    <!-- GOUTTES D'EAU / WATER DROPS - largeur 0.18mm -->
    <!-- Chaque goutte = teardrop shape + petite ligne de highlight -->
    <!-- ============================================================ -->

    <!-- Drop 1 : droite, y≈26 -->
    <g transform="translate(14, 26)">
      <path d="M 0 -1 C -0.75 -0.25, -0.85 0.6, -0.5 1.1
               C -0.15 1.5, 0.5 1.5, 0.75 1.1
               C 1 0.6, 0.9 -0.25, 0.15 -1 Z"
            stroke-width="0.18"/>
      <path d="M -0.4 0.5 L -0.4 0.85" stroke-width="0.1"/>
    </g>

    <!-- Drop 2 : gauche, y≈39 -->
    <g transform="translate(6, 39)">
      <path d="M 0 -1 C -0.75 -0.25, -0.85 0.6, -0.5 1.1
               C -0.15 1.5, 0.5 1.5, 0.75 1.1
               C 1 0.6, 0.9 -0.25, 0.15 -1 Z"
            stroke-width="0.18"/>
      <path d="M -0.4 0.5 L -0.4 0.85" stroke-width="0.1"/>
    </g>

    <!-- Drop 3 : droite, y≈51 -->
    <g transform="translate(14.5, 51)">
      <path d="M 0 -1 C -0.75 -0.25, -0.85 0.6, -0.5 1.1
               C -0.15 1.5, 0.5 1.5, 0.75 1.1
               C 1 0.6, 0.9 -0.25, 0.15 -1 Z"
            stroke-width="0.18"/>
      <path d="M -0.4 0.5 L -0.4 0.85" stroke-width="0.1"/>
    </g>

    <!-- Drop 4 : droite, y≈63 -->
    <g transform="translate(14, 63)">
      <path d="M 0 -1 C -0.75 -0.25, -0.85 0.6, -0.5 1.1
               C -0.15 1.5, 0.5 1.5, 0.75 1.1
               C 1 0.6, 0.9 -0.25, 0.15 -1 Z"
            stroke-width="0.18"/>
      <path d="M -0.4 0.5 L -0.4 0.85" stroke-width="0.1"/>
    </g>

    <!-- Drop 5 : gauche, y≈74 -->
    <g transform="translate(7.1, 74)">
      <path d="M 0 -1 C -0.75 -0.25, -0.85 0.6, -0.5 1.1
               C -0.15 1.5, 0.5 1.5, 0.75 1.1
               C 1 0.6, 0.9 -0.25, 0.15 -1 Z"
            stroke-width="0.18"/>
      <path d="M -0.4 0.5 L -0.4 0.85" stroke-width="0.1"/>
    </g>

    <!-- Drop 6 : grosse goutte centrale sur la pointe, y≈84 -->
    <g transform="translate(10, 84)">
      <path d="M 0 -1.4 C -1.05 -0.35, -1.2 0.85, -0.7 1.55
               C -0.2 2.1, 0.7 2.1, 1.05 1.55
               C 1.4 0.85, 1.25 -0.35, 0.2 -1.4 Z"
            stroke-width="0.22"/>
      <path d="M -0.55 0.7 L -0.55 1.2" stroke-width="0.12"/>
    </g>

  </g>
</svg>
